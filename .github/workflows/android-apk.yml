# Compila el APK de Android y lo publica en Releases cada vez que cambia la parte de Android.
# La web se actualiza sola dentro de la app; esto solo hace falta para el código nativo
# (botón de ajustes rápidos, widgets). La app avisa cuando hay una versión nueva.
#
# - Rama main: versión oficial vN (marcada como «latest»; es la que ofrece la app).
# - Cualquier otra rama: versión de PRUEBA prueba-N (prerelease, nunca «latest», así que
#   la app no la ofrece como actualización). Lleva el APK y el registro de la compilación.
# - Si falla: el registro queda en la prerelease build-fallido (main) o build-fallido-rama (ramas).
#
# Firma: pon dos secretos en Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_B64 y ANDROID_KS_PASS
# Sin ellos se compila con una firma temporal (para actualizar habría que desinstalar antes).
name: APK Android
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['android-app/**', '.github/workflows/android-apk.yml', 'icons/**']
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://mieconomia.bertoproject.com' }}
      VERSION: ${{ github.run_number }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
      GH_TOKEN: ${{ github.token }}
      RAMA: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          bash android-app/build.sh 2>&1 | tee build.log
      - name: Publicar versión
        shell: bash
        run: |
          if [ -n "${KS_PASS:-}" ]; then perl -pi -e 's/\Q$ENV{KS_PASS}\E/***/g' build.log; fi
          FIRMA=$(grep -o 'FIRMA=[a-z]*' build.log | tail -1 | cut -d= -f2)
          if [ "$RAMA" = "main" ]; then
            gh release delete build-fallido -y --cleanup-tag || true
            gh release create "v${VERSION}" android-app/mi-economia.apk --latest \
              --title "App Android 1.${VERSION}" \
              --notes "Instala mi-economia.apk. Firma: ${FIRMA}. Con firma propia se instala encima sin perder nada."
          else
            gh release delete build-fallido-rama -y --cleanup-tag || true
            gh release create "prueba-${VERSION}" android-app/mi-economia.apk build.log \
              --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Prueba ${RAMA} 1.${VERSION}" \
              --notes "Versión de PRUEBA de la rama ${RAMA} (commit ${GITHUB_SHA::7}). No es la oficial y la app no la ofrece como actualización. Firma: ${FIRMA}."
          fi
      - name: Guardar el error si falla
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || echo "Sin registro de compilación" > build.log
          if [ -n "${KS_PASS:-}" ]; then perl -pi -e 's/\Q$ENV{KS_PASS}\E/***/g' build.log; fi
          if [ "$RAMA" = "main" ]; then T=build-fallido; else T=build-fallido-rama; fi
          gh release delete "$T" -y --cleanup-tag || true
          gh release create "$T" build.log --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Compilación fallida ${VERSION} (${RAMA})" --notes "Registro del error para revisarlo."
