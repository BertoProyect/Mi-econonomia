# Compila el APK de Android y lo publica en Releases cada vez que cambia la parte de Android.
# La web se actualiza sola dentro de la app; esto solo hace falta para el código nativo
# (botón de ajustes rápidos). La app avisa cuando hay una versión nueva.
#
# Firma: pon dos secretos en Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_B64 y ANDROID_KS_PASS
# Sin ellos se compila con una firma temporal (para actualizar habría que desinstalar antes).
name: APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apk.yml', 'icons/**']
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://mieconomia.bertoproject.com' }}
      VERSION: ${{ github.run_number }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          bash android-app/build.sh 2>&1 | tee build.log
      - name: Publicar versión
        shell: bash
        run: |
          gh release delete build-fallido -y --cleanup-tag || true
          FIRMA=$(grep -o 'FIRMA=[a-z]*' build.log | tail -1 | cut -d= -f2)
          gh release create "v${VERSION}" android-app/mi-economia.apk --latest \
            --title "App Android 1.${VERSION}" \
            --notes "Instala mi-economia.apk. Firma: ${FIRMA}. Con firma propia se instala encima sin perder nada."
      - name: Guardar el error si falla
        if: failure()
        shell: bash
        run: |
          gh release delete build-fallido -y --cleanup-tag || true
          gh release create build-fallido build.log --prerelease --title "Compilación fallida ${VERSION}" --notes "Registro del error para revisarlo."
