# Construye el APK de Android en GitHub (tu Mac no tiene que compilar nada).
# Uso: pestaña Actions → "APK Android" → Run workflow. El APK aparece en "Artifacts".
name: APK Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Capacitor
        run: npm install
      - name: Configurar URL de la web
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node make-config.js
      - name: Crear proyecto Android
        run: npx cap add android && npx cap sync android
      - name: Poner el icono
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            [ -f "$d/ic_launcher.png" ] && cp ../icons/icon-512.png "$d/ic_launcher.png"
            [ -f "$d/ic_launcher_round.png" ] && cp ../icons/icon-512.png "$d/ic_launcher_round.png"
            [ -f "$d/ic_launcher_foreground.png" ] && cp ../icons/maskable-512.png "$d/ic_launcher_foreground.png"
          done
          sed -i 's/#FFFFFF/#000000/I' android/app/src/main/res/values/ic_launcher_background.xml || true
      - name: Compilar APK
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mi-economia-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
